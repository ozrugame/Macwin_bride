name: Build macOS launchers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check source and history for account data
        run: python3 scripts/privacy_check.py --history
      - name: Install build compiler
        run: brew bundle
      - name: Test
        run: make test
      - name: Build isolated package
        run: make package
      - name: Upload launcher bundle and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MacWinBridge-macos-arm64
          path: |
            .artifacts/*.tar.gz
            .artifacts/*.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
